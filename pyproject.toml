[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expertedit"
version = "0.1.0"
description = "ExpertEdit model architecture and prepared-motion inference"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.1", "numpy>=1.23", "einops>=0.6", "roma>=1.3"]

[project.scripts]
expertedit-infer = "expertedit.inference:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["expertedit", "expertedit.*"]
namespaces = false

[tool.setuptools]
include-package-data = false
license-files = ["LICENSE", "NOTICE"]
